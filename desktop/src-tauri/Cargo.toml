[package]
name = "bili-cache-exporter"
version = "2.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "bili_core"
crate-type = ["rlib"]

[[bin]]
name = "BiliCacheExporter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
