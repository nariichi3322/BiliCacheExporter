# Checks every PR and main push; publishes a release when main carries a version that has no v<version> tag yet.
# Release flow: bump the version on a branch, run desktop/package.ps1 locally (GUI checks CI does not run), PR, merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and its tag
      pull-requests: read # read the merged PR body for release notes
    defaults:
      run:
        shell: pwsh
    env:
      # Same pinned build the app downloads (desktop/src-tauri/src/tools.rs).
      FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip
      FFMPEG_SHA256: fec81ae03971d9dd4be3ebe02e263bd2ec1d789483f931bdba5f5715e65da2e9
      FFMPEG_DIR: ${{ github.workspace }}\..\ffmpeg
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          $tauri = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tauri -ne $npm -or $tauri -ne $cargo) { throw "Versions differ: tauri.conf.json $tauri, package.json $npm, Cargo.toml $cargo" }
          $tagged = [bool](git ls-remote --tags origin "refs/tags/v$tauri")
          $release = '${{ github.event_name }}' -eq 'push' -and !$tagged
          "version=$tauri" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Output "Version $tauri; tag exists: $tagged; release: $release"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}

      - name: Download FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest $env:FFMPEG_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg SHA-256 mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:FFMPEG_DIR

      - name: Check
        run: |
          $ffmpeg = (Get-ChildItem $env:FFMPEG_DIR -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          ./desktop/check.ps1 -FFmpeg $ffmpeg

      # Same package shape as desktop/package.ps1, without its GUI verification.
      - name: Build package
        if: steps.version.outputs.release == 'true'
        working-directory: desktop
        run: |
          npx tauri build
          if ($LASTEXITCODE) { throw 'tauri build failed' }
          $out = Join-Path $env:RUNNER_TEMP 'release'
          $package = Join-Path $out 'BiliCacheExporter-win-x64'
          New-Item -ItemType Directory -Path (Join-Path $package 'licenses') -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/BiliCacheExporter.exe', '../README.md' -Destination $package
          node e2e/licenses.mjs (Join-Path $package 'licenses/THIRD-PARTY.txt')
          if ($LASTEXITCODE) { throw 'Writing licenses failed' }

          $files = @(Get-ChildItem -LiteralPath $package -File -Recurse)
          $exes = @($files | Where-Object Extension -eq '.exe')
          $bad = @($files | Where-Object { $_.Extension -in @('.dll', '.m4s', '.mp4', '.jpg', '.png', '.pdb', '.log') -or $_.Name -eq 'settings.json' })
          if ($exes.Count -ne 1 -or $exes[0].Name -ne 'BiliCacheExporter.exe' -or $bad.Count -gt 0) { throw "Unexpected package contents: $($files.Name -join ', ')" }
          $exe = Join-Path $package 'BiliCacheExporter.exe'
          $version = (& $exe --version | Out-String).Trim()
          if (!$version.Contains($env:GITHUB_SHA) -or $version.Contains('.dirty')) { throw "Version $version does not name clean commit $env:GITHUB_SHA" }

          @{ Commit = $env:GITHUB_SHA; Dirty = $false; Version = $version; ExeSHA256 = (Get-FileHash $exe).Hash } | ConvertTo-Json | Set-Content (Join-Path $package 'BUILD-INFO.json')
          $zip = Join-Path $out 'BiliCacheExporter-win-x64.zip'
          Compress-Archive -LiteralPath $package -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "$hash  BiliCacheExporter-win-x64.zip" | Set-Content -LiteralPath (Join-Path $out 'SHA256.txt') -Encoding UTF8
          Write-Output "Built $version, ZIP SHA-256 $hash"

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'release'
          $assets = (Join-Path $out 'BiliCacheExporter-win-x64.zip'), (Join-Path $out 'SHA256.txt')
          $sha = "SHA-256: ``$((Get-Content (Join-Path $out 'SHA256.txt')).Split(' ')[0])``"
          # Notes are the merged PR's body; a direct push (no PR) falls back to generated notes.
          $body = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" --jq '.[0].body // ""'
          if ($LASTEXITCODE) { throw 'Looking up the merged PR failed' }
          if ($body) {
            $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
            (($body | Out-String).TrimEnd() + "`n`n$sha") | Set-Content -LiteralPath $notes -Encoding UTF8
            gh release create $env:TAG @assets --target $env:GITHUB_SHA --title $env:TAG --notes-file $notes
          } else {
            gh release create $env:TAG @assets --target $env:GITHUB_SHA --title $env:TAG --generate-notes --notes $sha
          }
          if ($LASTEXITCODE) { throw 'Creating the release failed' }
